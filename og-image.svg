<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#080b0f"/>
      <stop offset="100%" style="stop-color:#0f1318"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="60%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#00ff88"/>
    </linearGradient>
    <!-- Grid pattern -->
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="rgba(0,255,136,0.04)" stroke-width="1"/>
    </pattern>
    <!-- Glow -->
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" style="stop-color:rgba(0,255,136,0.08)"/>
      <stop offset="100%" style="stop-color:rgba(0,0,0,0)"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Border -->
  <rect x="20" y="20" width="1160" height="590" rx="24" fill="none" stroke="rgba(0,255,136,0.15)" stroke-width="1.5"/>

  <!-- Eyebrow -->
  <text x="600" y="200" text-anchor="middle"
    font-family="'DM Mono', monospace" font-size="18" letter-spacing="6"
    fill="#00ff88" opacity="0.7">WORD × MEANING</text>

  <!-- Main title -->
  <text x="600" y="320" text-anchor="middle"
    font-family="'Syne', 'Arial Black', sans-serif" font-size="120" font-weight="900"
    letter-spacing="-4" fill="url(#titleGrad)">Semantle</text>

  <!-- Subtitle -->
  <text x="600" y="390" text-anchor="middle"
    font-family="'DM Sans', Arial, sans-serif" font-size="26" font-weight="300"
    fill="#718096">Guess the word — not by spelling, but by meaning.</text>

  <!-- Feature pills -->
  <g transform="translate(600, 470)">
    <!-- Daily Riddle pill -->
    <rect x="-310" y="-22" width="160" height="44" rx="22"
      fill="rgba(0,255,136,0.08)" stroke="rgba(0,255,136,0.3)" stroke-width="1.5"/>
    <text x="-230" y="6" text-anchor="middle"
      font-family="'DM Mono', monospace" font-size="16" fill="#00ff88">🎭 Daily Riddle</text>

    <!-- Daily Theme pill -->
    <rect x="-130" y="-22" width="160" height="44" rx="22"
      fill="rgba(0,255,136,0.08)" stroke="rgba(0,255,136,0.3)" stroke-width="1.5"/>
    <text x="-50" y="6" text-anchor="middle"
      font-family="'DM Mono', monospace" font-size="16" fill="#00ff88">🌊 Daily Theme</text>

    <!-- Random pill -->
    <rect x="50" y="-22" width="160" height="44" rx="22"
      fill="rgba(0,255,136,0.08)" stroke="rgba(0,255,136,0.3)" stroke-width="1.5"/>
    <text x="130" y="6" text-anchor="middle"
      font-family="'DM Mono', monospace" font-size="16" fill="#00ff88">♾️ Random Mode</text>

    <!-- Free pill -->
    <rect x="230" y="-22" width="100" height="44" rx="22"
      fill="rgba(0,255,136,0.15)" stroke="rgba(0,255,136,0.5)" stroke-width="1.5"/>
    <text x="280" y="6" text-anchor="middle"
      font-family="'DM Mono', monospace" font-size="16" fill="#00ff88">Free</text>
  </g>

  <!-- URL -->
  <text x="600" y="590" text-anchor="middle"
    font-family="'DM Mono', monospace" font-size="16"
    fill="rgba(255,255,255,0.2)">semantle-game.vercel.app</text>
</svg>
